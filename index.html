<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking Hair Do by Ekkles</title>

<style>
:root{
    --gold:#c5a059;
    --dark:#111111;
    --light:#ffffff;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:0;
    background:var(--dark);
    color:var(--light);
    font-family:Arial, sans-serif;
    position: relative;
}

.top-left-logo {
    position: absolute;
    top: 20mm;
    left: 0mm;
    width: 20mm;
    height: 20mm;
    object-fit: contain;
    cursor: pointer;
    transition: top 0.15s ease-in-out; 
}

.top-left-logo.pressed {
    top: 25mm;
}

.top-right-wa {
    position: absolute;
    top: 20mm;
    right: 0mm;
    width: 20mm;
    height: 20mm;
    object-fit: contain;
}

.container{
    width:95%;
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    color:var(--gold);
    letter-spacing:2px;
    margin-top: 5mm;
    margin-bottom: 10px;
}

.subtitle{
    text-align:center;
    margin-bottom:30px;
    color:var(--gold);
    font-size:150%;
}

.form-box{
    border:1px solid var(--gold);
    border-radius:20px;
    padding:25px;
    background:#1a1a1a;
}

.form-box label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    color:var(--gold);
    font-size: 150%;
}

.form-box input,
.form-box textarea,
.form-box select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    font-size: 24px;
}

textarea{
    min-height:100px;
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    background:var(--gold);
    border:none;
    color:white;
    font-size:18px;
    border-radius:15px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

.success{
    display:none;
    margin-top:20px;
    padding:15px;
    border-radius:10px;
    background:#1f4723;
    color:#9cff9c;
    text-align:center;
}

.footer{
    text-align:center;
    padding:30px;
    color:#888;
}
</style>
</head>

<body>

<img src="logo.png" alt="Logo By Ekkles" class="top-left-logo" id="logoEkkles">

<a href="https://wa.me/6281314798161" target="_blank">
    <img src="walogo.png" alt="WhatsApp" class="top-right-wa">
</a>

<div class="container">

    <h1>BOOKING HAIR DO</h1>

    <div class="subtitle">
        by Ekkles Professional Hairstylist
    </div>

    <div class="form-box">

        <form id="bookingForm">

            <label>Nama Client</label>
            <input type="text" id="nama" required>

            <label>Nomor WhatsApp</label>
            <input type="text" id="wa" required onblur="this.value = normalizeWhatsApp(this.value)">

            <label>Tanggal Booking</label>
            <input type="date" id="tanggal" required>

            <label>Jam Booking</label>
            <input type="time" id="jam" required>

            <label>Alamat Lokasi</label>
            <textarea id="lokasi" required></textarea>

            <label>Jumlah Pax</label>
            <select id="jumlah_pax">
                <option>1 Pax</option>
                <option>2 Pax</option>
                <option>3 Pax</option>
                <option>4 Pax</option>
                <option>5 Pax</option>
                <option>Minta dihubungi Admin</option>
            </select>

            <label>Pembayaran</label>
            <select id="pembayaran">
                <option>Dp + Lunas</option>
                <option>Dp H-3 Lunas</option>
            </select>

            <button type="submit">KIRIM BOOKING</button>

        </form>

        <div class="success" id="successMessage">
            Booking berhasil dikirim ✨
        </div>

    </div>

</div>

<div class="footer">
    © 2026 Hair Do by Ekkles
</div>

<script>
function normalizeWhatsApp(input) {
    let cleaned = input.replace(/\D/g, '');
    if (cleaned.startsWith('0')) {
        cleaned = '62' + cleaned.substring(1);
    } else if (cleaned.startsWith('8')) {
        cleaned = '62' + cleaned;
    }
    return '+' + cleaned;
}

const logo = document.getElementById('logoEkkles');
logo.addEventListener('click', () => {
    logo.classList.add('pressed');
    setTimeout(() => {
        logo.classList.remove('pressed');
    }, 150);
    setTimeout(() => {
        window.location.href = "https://aban-007.github.io/hairdo-by-ekkles/";
    }, 300);
});

const scriptURL = "https://script.google.com/macros/s/AKfycbxOxUrVqJXDNOKymwFnsqBZr7y-z8Silf_oNV0FdZpuj7tZ1icsEyTwhQ5c1YNx7-nX/exec";

const form = document.getElementById('form_simple');

form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const data = {
        nama: document.getElementById('nama').value,
        wa: normalizeWhatsApp(document.getElementById('wa').value),
        tanggal: document.getElementById('tanggal').value,
        jam: document.getElementById('jam').value,
        lokasi: document.getElementById('lokasi').value,
        jumlah_pax: document.getElementById('jumlah_pax').value,
        pembayaran: document.getElementById('pembayaran').value,
        status: 'Pending'
    };

    try {
        const response = await fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(data)
        });
        const result = await response.json();
        if(result.result === 'success'){
            document.getElementById('successMessage').style.display = 'block';
            form.reset();
        }
    } catch(error){
        alert('Terjadi kesalahan.');
        console.log(error);
    }
});
</script>

</body>
</html>
